name: Build

# This repo had no CI at all before this file (see CLAUDE.md's "Polish / infra" — "No CI"
# was the top item there). One workflow covers what test.yml+build.yml split into on the
# backend, since there's no existing frontend test.yml to stay separate from: lint, unit
# tests with coverage, a SonarCloud scan, and — only on a real push to main — building and
# pushing the frontend image to GHCR for deploy.yml to pick up. Playwright e2e
# (`npm run test:e2e`) deliberately isn't run here — it needs a full running stack
# (frontend + backend + seeded Postgres), which doesn't exist in this job; that suite stays
# a local/pre-deploy check for now, same as it's always been.
#
# Every `uses:` below is pinned to a full commit SHA, not a floating version tag — a tag
# (even one from a trusted publisher) can be retargeted to different code later without this
# file ever changing, a real supply-chain vector GitHub itself documents. Each SHA was
# resolved live against the real tag (verified 2026-08-22 via two independent GitHub API
# endpoints, not guessed) — the trailing `# vX` comment is just for a human to see which
# release it corresponds to; only the SHA is what actually pins.
#
# `permissions:` is set per-job, not once at workflow level (SonarCloud flagged the
# workflow-level version as over-broad — least privilege means the `sonar` job, which never
# pushes anything, shouldn't inherit `packages: write` just because a sibling job needs it).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud's new-code/blame features want real history, not the default
          # single-commit shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarCloud specifically (not a self-hosted server) — the action's default host
          # when SONAR_HOST_URL is unset.
        with:
          # sonar.organization is a guess (your GitHub username, matching SonarCloud's
          # default when importing a repo) — confirm against the real value once the
          # SonarCloud project exists, fix here if it differs.
          args: >
            -Dsonar.organization=0xkoat
            -Dsonar.projectKey=0xkoat_frontend-gerance
            -Dsonar.sources=src
            -Dsonar.tests=src,__tests__
            -Dsonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,e2e/**,**/coverage/**

  build-and-push:
    needs: sonar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gerance-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gerance-frontend:latest
