name: Deploy

# Same pattern as backend-gerance's deploy.yml (see that file's comment for the full
# reasoning) — triggered by this repo's own build.yml succeeding on main, plus a manual
# button. Deploys only the `frontend` service; never touches `postgres`, `migrate`, or
# `backend`, which belong to the backend-gerance repo's own pipeline (or, for `postgres`, a
# one-time manual step — see DOCKERIZATION_TODO.md in gerance-platform's root).
#
# Assumes docker-compose.image.yml + a real .env already exist on the VM at
# /opt/gerance-platform, and that `backend` is already up and healthy there — `frontend`'s
# `depends_on: backend: condition: service_healthy` in that file will otherwise block this
# from ever coming up. Fine for steady-state redeploys; on a brand-new VM, deploy
# backend-gerance first.

on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runs ON the VM, through a self-hosted runner registered with the `secops-vm` label,
    # so nothing has to reach the VM from the internet (a VirtualBox VM behind NAT can't be
    # SSHed into from GitHub's cloud). build.yml still runs on GitHub-hosted runners.
    runs-on: [self-hosted, secops-vm]

    steps:
      - name: Deploy frontend
        working-directory: /opt/gerance-platform
        run: |
          set -e
          # Only needed while the GHCR packages are private. The login is dropped again at
          # the end of the job so the VM (and any OVA exported from it) keeps no token.
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

          # FRONTEND_TAG, not a shared TAG: `docker compose up` reconciles the whole dependency
          # graph, so a shared tag made one repo's deploy try to pull the other repo's image
          # at the wrong sha (real failed deploy, 2026-08-22). Each pipeline moves only its
          # own tag; see docker-compose.image.yml.
          export FRONTEND_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          docker compose -f docker-compose.image.yml pull frontend
          docker compose -f docker-compose.image.yml up -d frontend

      - name: Forget the registry login
        if: always()
        run: docker logout ghcr.io
